    <script>
      // Aplica o último tema salvo antes do primeiro paint (evita piscar)
      try {
        var mode = localStorage.getItem('supaco:mode') || 'system';
        var saved = JSON.parse(localStorage.getItem('supaco:themevars') || 'null');
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        if (saved && saved.dark === dark) for (var k in saved.vars) root.style.setProperty(k, saved.vars[k]);
      } catch (e) {}
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
