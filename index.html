<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1310" media="(prefers-color-scheme: dark)" />
    <title>Supaco · notas, faltas e horários do IFRN</title>
    <meta name="description" content="Suas notas, faltas e horários do SUAP/IFRN em um só lugar, rápido e direto." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash
      try {
        var t = localStorage.getItem('supaco:theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
